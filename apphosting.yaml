# Firebase App Hosting settings for the Ciray storefront (project ciray-scrub, backend cirayscrubs).
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # firebase: live backend (catalog, admin portal, team inquiries). "demo" shows the sample catalog instead.
  - variable: NEXT_PUBLIC_CIRAY_MODE
    value: firebase
    availability: [BUILD, RUNTIME]
  # Stays off until Stripe test keys, the webhook and allowedReturnOrigins are set (platform/DEPLOY.md).
  - variable: NEXT_PUBLIC_ENABLE_TEST_CHECKOUT
    value: "false"
    availability: [BUILD, RUNTIME]
  # Firebase web config is public by design (access is enforced by security rules and functions).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCgygGiRXCEawW8QfftYBEYzr4lB9S6KJg
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:252568935026:web:4540a7a7b68fb7f97680eb"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ciray-scrub
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ciray-scrub.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ciray-scrub.firebasestorage.app
    availability: [BUILD, RUNTIME]
  # reCAPTCHA Enterprise site key for App Check (public). Tokens are sent but not yet enforced:
  # the backend enforces only when ENFORCE_APP_CHECK=true (platform/DEPLOY.md §7).
  - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY
    value: 6LeiEg4uAAAAAJK_GoH2cicmWeJH2WIFTeLTZq0Z
    availability: [BUILD, RUNTIME]
